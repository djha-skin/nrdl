# Builds, tests, and publishes the Python NRDL implementation.
#
# Publishing to PyPI uses trusted publishing (OpenID Connect): the
# workflow requests a short-lived token from GitHub and PyPI accepts it
# without a stored password or API token. The `pypi` environment must be
# configured in the repository settings with the trusted publisher that
# matches this workflow file.
#
# A tag named python-* (e.g. python-0.1.0) triggers a release.

name: Python package

on:
  push:
    tags:
      - "python-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package
        run: pip install -e "python/.[dev]"
      - name: Run the test suite
        run: pytest python/tests

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build python
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # mint a token to authenticate to PyPI
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

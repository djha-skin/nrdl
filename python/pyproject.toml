[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nrdl"
version = "0.2.0"
description = "A Python implementation of NRDL, the Nestable Readable Document Language"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Daniel Jay Haskin", email = "djhaskin987@gmail.com" }]
keywords = ["nrdl", "serialization", "deserialization", "json", "configuration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]

[project.optional-dependencies]
dev = ["pytest", "build"]
docs = ["sphinx"]

[project.scripts]
nrdl = "nrdl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nrdl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
